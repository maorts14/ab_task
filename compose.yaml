services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  topic-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        for topic in raw-orders.source-a.v1 raw-orders.source-b.v1 processed-orders.v1 normalization-failures-dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1;
        done

  gateway:
    build:
      context: .
      dockerfile: ingestion-gateway/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  normalizer-source-a:
    build:
      context: .
      dockerfile: normalizer-worker/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOURCE_SYSTEM: SOURCE_A
      INPUT_TOPIC: raw-orders.source-a.v1
      CONSUMER_GROUP: normalizer-source-a

  normalizer-source-b:
    build:
      context: .
      dockerfile: normalizer-worker/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOURCE_SYSTEM: SOURCE_B
      INPUT_TOPIC: raw-orders.source-b.v1
      CONSUMER_GROUP: normalizer-source-b

  mock-destination:
    build:
      context: .
      dockerfile: mock-destination/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
